apiVersion: apps/v1
kind: Deployment
metadata:
  name: capstone-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: capstone-api
  template:
    metadata:
      labels:
        app: capstone-api
    spec:
      containers:
        - name: api
          image: capstone-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef: { name: capstone-config, key: database_url }
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef: { name: capstone-config, key: redis_url }
            - name: REDIS_RESULT_URL
              valueFrom:
                configMapKeyRef: { name: capstone-config, key: redis_result_url }
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: capstone-secrets, key: jwt_secret_key }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: capstone-api-service
spec:
  selector:
    app: capstone-api
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: capstone-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: capstone-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
