apiVersion: v1
kind: ConfigMap
metadata:
  name: capstone-config
data:
  database_url: "postgresql+asyncpg://appuser:apppass@postgres-service:5432/appdb"
  redis_url: "redis://redis-service:6379/0"
  redis_result_url: "redis://redis-service:6379/1"
---
apiVersion: v1
kind: Secret
metadata:
  name: capstone-secrets
type: Opaque
stringData:
  jwt_secret_key: "change-me-in-production"
